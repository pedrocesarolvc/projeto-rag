# Etapa 7 — dois serviços (seção 7.6): a aplicação e o Postgres com
# pgvector já embutido (pgvector/pgvector, não a imagem postgres pura
# — ver docs/documentacao.md, Etapa 4, sobre a armadilha de instalar
# a extensão à parte).
#
# O Ollama (LLM, Etapa 6) roda no host, não aqui — é um runtime mais
# pesado (GPU/CPU, modelo de alguns GB) que a maioria de quem avalia
# o projeto já tem ou instala uma vez, fora do ciclo de vida do
# projeto. O serviço `app` alcança-o via host.docker.internal.

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      # host.docker.internal já resolve nativamente no Docker Desktop
      # (Windows/Mac); esta linha é o que faz o mesmo funcionar no
      # Docker Engine puro (Linux).
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # persiste o modelo de embedding (~1 GB) entre reinícios — sem
      # isso, cada "docker compose up" do zero rebaixaria tudo de novo.
      - cache_embeddings:/root/.cache/huggingface

volumes:
  dados_postgres:
  cache_embeddings:
